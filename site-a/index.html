<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="coins-layer" id="coinsLayer"></div>

    <img src="./images/logo.png" class="logo" alt="">
    <img src="./images/ip.png" class="ip" alt="">

    <div class="btn-wrap">
      <a href="https://s.f1.top/r?p=h2pEYZ5DDuYq"
         class="btn-link"
         id="btn"
         data-area="main_btn"
         rel="noopener">
        <img src="./images/btn.png" class="btn-img" alt="">
      </a>
    </div>

    <div class="btn1-wrap">
      <a href="https://t.me/F1top_bro"
         class="btn-link"
         id="btn1"
         data-area="telegram_btn"
         rel="noopener">
        <img src="./images/btn1.png" class="btn-img" alt="">
      </a>
    </div>
  </div>

  <script>
    (function(){
      var layer = document.getElementById("coinsLayer");
      var btn = document.getElementById("btn");
      var btn1 = document.getElementById("btn1");
      var buttons = [btn,btn1];
      var coinTimer = null;
      var isOpening = false;

      btn.href = BTN_URL;
      btn1.href = BTN1_URL;

      function eventId(prefix){
        if(window.crypto && typeof crypto.randomUUID === "function"){
          return prefix + "_" + crypto.randomUUID();
        }

        return prefix + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      function productParams(area,url){
        return {
          content_ids: [PRODUCT_ID],
          content_type: "product",
          content_name: PRODUCT_NAME,
          content_category: PRODUCT_CATEGORY,
          contents: [
            {
              id: PRODUCT_ID,
              quantity: 1,
              item_price: PRODUCT_VALUE
            }
          ],
          value: PRODUCT_VALUE,
          currency: PRODUCT_CURRENCY,
          click_area: area,
          destination_url: url,
          event_source_url: window.location.href
        };
      }

      function leadParams(area,url){
        return {
          action_source: "website",
          content_name: PRODUCT_NAME,
          content_category: PRODUCT_CATEGORY,
          contact_method: area === "telegram_btn" ? "telegram" : "redirect",
          click_area: area,
          destination_url: url,
          event_source_url: window.location.href
        };
      }

      function sendFallbackPixel(pixelId,eventName,params,eventID){
        var url = "https://www.facebook.com/tr?id=" + encodeURIComponent(pixelId) +
          "&ev=" + encodeURIComponent(eventName) +
          "&dl=" + encodeURIComponent(window.location.href) +
          "&rl=" + encodeURIComponent(document.referrer || "") +
          "&if=false" +
          "&ts=" + Date.now() +
          "&eid=" + encodeURIComponent(eventID || eventId(eventName.toLowerCase()));

        if(params){
          Object.keys(params).forEach(function(key){
            if(key === "contents"){
              url += "&cd[contents]=" + encodeURIComponent(JSON.stringify(params[key]));
            }else if(key === "content_ids"){
              url += "&cd[content_ids]=" + encodeURIComponent(JSON.stringify(params[key]));
            }else{
              url += "&cd[" + encodeURIComponent(key) + "]=" + encodeURIComponent(params[key]);
            }
          });
        }

        var img = new Image();
        img.src = url;
      }

      function sendFallbackAll(eventName,params,eventID){
        PIXEL_IDS.forEach(function(pixelId){
          sendFallbackPixel(pixelId,eventName,params,eventID);
        });
      }

      function trackMainButton(area,url){
        if(typeof fbq !== "function")return;

        var product = productParams(area,url);
        var lead = leadParams(area,url);

        var leadEventID = eventId("lead");
        var addToCartEventID = eventId("addtocart");
        var buttonClickEventID = eventId("button_click");

        /*
          主按鈕事件：
          Lead：給轉換優化
          AddToCart：給目錄配對率
          ButtonClick：自訂觀察點擊
        */
        fbq("track", "Lead", lead, {
          eventID: leadEventID
        });

        fbq("track", "AddToCart", product, {
          eventID: addToCartEventID
        });

        fbq("trackCustom", "ButtonClick", lead, {
          eventID: buttonClickEventID
        });

        /*
          備援送出：
          Network 會更容易看到 facebook.com/tr
        */
        sendFallbackAll("Lead", lead, leadEventID);
        sendFallbackAll("AddToCart", product, addToCartEventID);
        sendFallbackAll("ButtonClick", lead, buttonClickEventID);
      }

      function trackTelegramButton(area,url){
        if(typeof fbq !== "function")return;

        var params = leadParams(area,url);

        var contactEventID = eventId("contact");
        var buttonClickEventID = eventId("button_click");

        /*
          Telegram 按鈕事件：
          只送 Contact，不送 AddToCart / Purchase
        */
        fbq("track", "Contact", params, {
          eventID: contactEventID
        });

        fbq("trackCustom", "ButtonClick", params, {
          eventID: buttonClickEventID
        });

        sendFallbackAll("Contact", params, contactEventID);
        sendFallbackAll("ButtonClick", params, buttonClickEventID);
      }

      function openLink(el){
        if(isOpening)return;

        isOpening = true;

        buttons.forEach(function(item){
          if(item){
            item.classList.add("is-disabled");
          }
        });

        var area = el.dataset.area || "btn";
        var url = el.href;

        if(el.id === "btn"){
          trackMainButton(area,url);
        }

        if(el.id === "btn1"){
          trackTelegramButton(area,url);
        }

        /*
          延遲跳轉，讓 Pixel 有時間送出
        */
        setTimeout(function(){
          window.location.href = url;
        }, 700);

        setTimeout(resetState,1800);
      }

      function resetState(){
        isOpening = false;

        buttons.forEach(function(item){
          if(item){
            item.classList.remove("is-disabled");
          }
        });
      }

      function spawnCoin(){
        if(!layer)return;

        var coin = document.createElement("div");
        var dur = 6.5 + Math.random() * 4.5;

        coin.className = "coin";
        coin.style.setProperty("--size",Math.floor(10 + Math.random() * 18) + "px");
        coin.style.left = Math.random() * 100 + "%";
        coin.style.animationDuration = dur + "s," + (0.8 + Math.random() * 1.2) + "s";

        layer.appendChild(coin);

        setTimeout(function(){
          coin.remove();
        },dur * 1000 + 200);
      }

      function startCoins(){
        if(coinTimer)return;

        coinTimer = setInterval(function(){
          for(var i=0,n=1+Math.floor(Math.random()*2);i<n;i++){
            spawnCoin();
          }
        },900);
      }

      function stopCoins(){
        clearInterval(coinTimer);
        coinTimer = null;
      }

      startCoins();

      document.addEventListener("visibilitychange",function(){
        document.hidden ? stopCoins() : startCoins();
      });

      window.addEventListener("pageshow",function(e){
        e.persisted ? resetState() : isOpening=false;
      });

      buttons.forEach(function(el){
        if(!el)return;

        el.addEventListener("click",function(e){
          e.preventDefault();
          openLink(this);
        });
      });
    })();
  </script>
</body>
</html>
