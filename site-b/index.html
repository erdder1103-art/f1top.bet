<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B 網站</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(92vw,420px);border-radius:22px;background:linear-gradient(180deg,#20242d,#111318);border:1px solid #333946;padding:34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}h1{margin:0 0 12px;font-size:32px}.tag{display:inline-block;background:#f2994a;color:#111;padding:6px 12px;border-radius:999px;font-weight:800;margin-bottom:16px}.p{color:#c8ced8;line-height:1.7;margin:0}.small{margin-top:22px;color:#8f98a8;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">B VERSION</div>
    <h1>B 網站已啟用</h1>
    <p class="p">這是 B 網站預留頁。請把你的 B 版本落地頁檔案放進 <strong>/site-b/</strong> 資料夾並覆蓋這個 index.html。</p>
    <div class="small">切回 A 網站時，系統會顯示 /site-a/ 內的原始小葵落地頁。</div>
  </div>
</body>
</html>
