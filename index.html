<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <script>
    var PIXEL_IDS = ["936447826035496", "945683774763445"];
    var BTN_URL = "https://t.me/f1topbet_bot";
    var SUPPORT_URL = "https://t.me/F1top_bro";

    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
    }(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");

    PIXEL_IDS.forEach(function(id){ fbq("init", id); });
    fbq("track", "PageView");
  </script>

  <noscript>
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=936447826035496&ev=PageView&noscript=1">
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=945683774763445&ev=PageView&noscript=1">
  </noscript>

  <style>
    :root{--max-w:420px}
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      min-height:100svh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .stage{
      width:min(100vw,var(--max-w));
      aspect-ratio:9/16;
      position:relative;
      overflow:hidden;
      border-radius:20px;
      background:#000;
    }
    .bg{
      position:absolute;
      inset:0;
      background:url("./images/bg.jpg") center/cover no-repeat;
    }
    .coins-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:2;
    }
    .logo,.ip,.btn-img{
      user-select:none;
      -webkit-user-drag:none;
    }
    .logo{
      position:absolute;
      top:5px;
      left:5px;
      width:200px;
      z-index:6;
      pointer-events:none;
    }
    .ip{
      position:absolute;
      top:15%;
      left:50%;
      transform:translateX(-50%);
      width:90%;
      max-width:360px;
      z-index:4;
      pointer-events:none;
    }
    .btn-wrap{
      position:absolute;
      bottom:50px;
      left:50%;
      transform:translateX(-50%);
      width:1005%;
      max-width:550px;
      z-index:10;
    }
    .cta-link{
      display:block;
      width:100%;
      animation:breatheGlow 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-img{
      width:100%;
      display:block;
      cursor:pointer;
      transition:transform .12s ease,opacity .12s ease;
    }
    .cta-link:active .btn-img{transform:scale(.97)}
    .is-disabled{pointer-events:none;opacity:.82}

    @keyframes breatheGlow{
      0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,0,0));transform:scale(1)}
      50%{filter:drop-shadow(0 0 18px rgba(255,215,0,.55));transform:scale(1.02)}
    }
    .coin{
      position:absolute;
      top:-12%;
      width:var(--size);
      height:var(--size);
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%,#fff3b0 0%,#ffd166 25%,#f4b400 55%,#c98a00 100%);
      box-shadow:0 10px 18px rgba(0,0,0,.25);
      opacity:.95;
      animation:fall linear forwards,spin linear infinite;
    }
    @keyframes fall{to{transform:translate3d(0,130vh,0) rotate(360deg);opacity:0}}
    @keyframes spin{to{rotate:360deg}}

    .tg-fab{
      position:absolute;
      right:14px;
      top:56%;
      transform:translateY(-50%);
      width:52px;
      height:52px;
      z-index:12;
      display:block;
      animation:tgBreathe 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color:transparent;
    }
    .tg-fab:before{
      content:"";
      width:52px;
      height:52px;
      display:block;
      background:url("./images/tg.png") center/contain no-repeat;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
    }
    .tg-fab:after{
      content:"客服";
      position:absolute;
      left:50%;
      bottom:-20px;
      transform:translateX(-50%);
      white-space:nowrap;
      padding:3px 8px;
      border-radius:999px;
      background:rgba(0,0,0,.72);
      color:#ffd966;
      font-size:12px;
      font-weight:800;
      border:1px solid rgba(255,217,102,.55);
    }
    @keyframes tgBreathe{
      0%,100%{transform:translateY(-50%) scale(1);opacity:.92}
      50%{transform:translateY(-50%) scale(1.08);opacity:1}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="coins-layer" id="coinsLayer"></div>

    <img src="./images/logo.png" class="logo">
    <img src="./images/ip.png" class="ip">

    <div class="btn-wrap">
      <a href="https://t.me/f1topbet_bot" class="cta-link" id="ctaBtn" data-area="main_cta" rel="noopener">
        <img src="./images/btn.png" class="btn-img">
      </a>
    </div>

    <a class="tg-fab" id="tgSupport" href="https://t.me/F1top_bro" rel="noopener" data-area="tg_support"></a>
  </div>

  <script>
    (function(){
      var layer = document.getElementById("coinsLayer");
      var ctaBtn = document.getElementById("ctaBtn");
      var tgSupport = document.getElementById("tgSupport");
      var coinTimer = null;
      var isOpening = false;

      ctaBtn.href = BTN_URL;
      tgSupport.href = SUPPORT_URL;

      function eventId(prefix){
        if(window.crypto && crypto.randomUUID) return prefix + "_" + crypto.randomUUID();
        return prefix + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      function track(area,url){
        if(typeof fbq !== "function") return;
        var params = {
          content_category:"telegram",
          contact_method:"telegram",
          click_area:area,
          destination:area === "tg_support" ? "telegram_support" : "telegram_bot",
          destination_url:url,
          value:1,
          currency:"USD"
        };
        fbq("track","Lead",params,{eventID:eventId("lead")});
        fbq("track","Contact",params,{eventID:eventId("contact")});
        fbq("trackCustom","TelegramOpen",params,{eventID:eventId("telegram_open")});
      }

      function openTelegram(area,url){
        if(isOpening) return;
        isOpening = true;
        ctaBtn.classList.add("is-disabled");
        tgSupport.classList.add("is-disabled");
        track(area,url);
        setTimeout(function(){ window.location.href = url; },180);
        setTimeout(resetState,1500);
      }

      function resetState(){
        isOpening = false;
        ctaBtn.classList.remove("is-disabled");
        tgSupport.classList.remove("is-disabled");
      }

      function spawnCoin(){
        if(!layer) return;
        var coin = document.createElement("div");
        var dur = 6.5 + Math.random() * 4.5;
        coin.className = "coin";
        coin.style.setProperty("--size", Math.floor(10 + Math.random() * 18) + "px");
        coin.style.left = Math.random() * 100 + "%";
        coin.style.animationDuration = dur + "s," + (0.8 + Math.random() * 1.2) + "s";
        layer.appendChild(coin);
        setTimeout(function(){ coin.remove(); }, dur * 1000 + 200);
      }

      function startCoins(){
        if(coinTimer) return;
        coinTimer = setInterval(function(){
          for(var i=0,n=1+Math.floor(Math.random()*2);i<n;i++) spawnCoin();
        },900);
      }

      function stopCoins(){
        clearInterval(coinTimer);
        coinTimer = null;
      }

      startCoins();
      document.addEventListener("visibilitychange",function(){document.hidden ? stopCoins() : startCoins();});
      window.addEventListener("pageshow",function(e){e.persisted ? resetState() : isOpening=false;});

      ctaBtn.addEventListener("click",function(e){
        e.preventDefault();
        openTelegram(this.dataset.area || "main_cta",BTN_URL);
      });

      tgSupport.addEventListener("click",function(e){
        e.preventDefault();
        openTelegram(this.dataset.area || "tg_support",SUPPORT_URL);
      });
    })();
  </script>
</body>
</html>
