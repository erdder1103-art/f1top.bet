<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0f172a;
      color: #fff;
      font-family: Arial, "Noto Sans TC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading {
      text-align: center;
      padding: 24px;
      opacity: .85;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="loading">載入中...</div>

  <script>
    async function loadConfigAndRedirect() {
      try {
        const response = await fetch('./config.json?v=' + Date.now(), { cache: 'no-store' });
        const config = await response.json();
        const mode = String(config.mode || 'A').toUpperCase();

        if (mode === 'B') {
          window.location.replace('./site-b/');
        } else {
          window.location.replace('./site-a/');
        }
      } catch (error) {
        window.location.replace('./site-a/');
      }
    }

    loadConfigAndRedirect();
  </script>
</body>
</html>
