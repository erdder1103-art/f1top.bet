<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>少林铁手-大师兄-注册送10USDT体验金</title>

  <script>
    window.APP_CONFIG = {
      PIXEL_ID: '1292193032259788',
      TARGET_URL: 'https://t.me/f1topbet_bot',
      SUPPORT_URL: 'https://t.me/F1top_bro',
      REDIRECT_DELAY: 800
    };

    !function(f,b,e,v,n,t,s){
      if(f.fbq) return;
      n=f.fbq=function(){
        n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments);
      };
      if(!f._fbq) f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e);
      t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', window.APP_CONFIG.PIXEL_ID);
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1292193032259788&ev=PageView&noscript=1"
      alt=""
    />
  </noscript>

  <style>
    :root { --max-w: 420px; }
    * { box-sizing: border-box; }

    body{
      margin:0;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      min-height:100svh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif;
    }

    .stage{
      width:min(100vw,var(--max-w));
      aspect-ratio:9/16;
      position:relative;
      overflow:hidden;
      border-radius:20px;
      background:#000;
    }

    .bg{
      position:absolute;
      inset:0;
      background:url("./images/bg.jpg") center/cover no-repeat;
      z-index:0;
      user-select:none;
      -webkit-user-drag:none;
    }

    .coins-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:2;
    }

    .logo{
      position:absolute;
      top:-10px;
      left:-10px;
      width:150px;
      z-index:6;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .ip{
      position:absolute;
      top:-5%;
      left:50%;
      transform:translateX(-50%);
      width:90%;
      max-width:360px;
      z-index:4;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .btn-wrap{
      position:absolute;
      bottom:-90px;
      left:50%;
      transform:translateX(-50%);
      width:85%;
      max-width:350px;
      z-index:10;
    }

    .cta-link{
      display:block;
      width:100%;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      outline:none;
      animation:breatheGlow 1.6s ease-in-out infinite;
    }

    .btn-img{
      width:100%;
      display:block;
      cursor:pointer;
      transition:transform .12s ease, opacity .12s ease;
      user-select:none;
      -webkit-user-drag:none;
    }

    .cta-link:active .btn-img{
      transform:scale(0.97);
    }

    .cta-link.is-disabled,
    .tg-fab.is-disabled{
      pointer-events:none;
      opacity:.98;
    }

    @keyframes breatheGlow{
      0%{
        filter:drop-shadow(0 0 0 rgba(255,215,0,0));
        transform:translateX(0) scale(1);
      }
      50%{
        filter:drop-shadow(0 0 18px rgba(255,215,0,.55));
        transform:translateX(0) scale(1.02);
      }
      100%{
        filter:drop-shadow(0 0 0 rgba(255,215,0,0));
        transform:translateX(0) scale(1);
      }
    }

    .coin{
      position:absolute;
      top:-12%;
      width:var(--size);
      height:var(--size);
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #fff3b0 0%, #ffd166 25%, #f4b400 55%, #c98a00 100%);
      box-shadow:0 10px 18px rgba(0,0,0,.25);
      opacity:.95;
      animation:fall linear forwards, spin linear infinite;
    }

    @keyframes fall{
      to{
        transform:translate3d(0,130vh,0) rotate(360deg);
        opacity:0;
      }
    }

    @keyframes spin{
      to{ rotate:360deg; }
    }

    .tg-fab{
      position:absolute;
      right:14px;
      top:56%;
      transform:translateY(-50%);
      width:52px;
      height:52px;
      z-index:12;
      display:block;
      animation:tgBreathe 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color:transparent;
    }

    .tg-fab::before{
      content:"";
      width:52px;
      height:52px;
      display:block;
      background:url("./images/tg.png") center/contain no-repeat;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
    }

    @keyframes tgBreathe{
      0%{
        transform:translateY(-50%) scale(1);
        opacity:.92;
      }
      50%{
        transform:translateY(-50%) scale(1.08);
        opacity:1;
      }
      100%{
        transform:translateY(-50%) scale(1);
        opacity:.92;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="coins-layer" id="coinsLayer"></div>

    <img src="./images/logo.png" class="logo" alt="logo" loading="eager">
    <img src="./images/ip.png" class="ip" alt="ip" loading="eager">

    <div class="btn-wrap">
      <a
        href="https://t.me/f1topbet_bot"
        class="cta-link"
        id="ctaBtn"
        data-area="main_cta"
        aria-label="Open Telegram Bot"
        rel="noopener"
      >
        <img src="./images/btn.png" class="btn-img" alt="CTA Button" loading="eager">
      </a>
    </div>

    <a
      class="tg-fab"
      id="tgSupport"
      href="https://t.me/F1top_bro"
      target="_blank"
      rel="noopener"
      data-area="tg_support"
      aria-label="Telegram Support"
    ></a>
  </div>

  <script>
    (function(){
      var PIXEL_ID = window.APP_CONFIG.PIXEL_ID;
      var TARGET_URL = window.APP_CONFIG.TARGET_URL;
      var SUPPORT_URL = window.APP_CONFIG.SUPPORT_URL;
      var REDIRECT_DELAY = window.APP_CONFIG.REDIRECT_DELAY;

      var layer = document.getElementById("coinsLayer");
      var ctaBtn = document.getElementById("ctaBtn");
      var tgSupport = document.getElementById("tgSupport");

      var coinTimer = null;
      var isRedirecting = false;
      var redirectTimer = null;

      function spawnCoin() {
        var coin = document.createElement("div");
        coin.className = "coin";

        var size = Math.floor(10 + Math.random() * 18);
        var left = Math.random() * 100;
        var dur = 6.5 + Math.random() * 4.5;
        var spinDur = 0.8 + Math.random() * 1.2;

        coin.style.setProperty("--size", size + "px");
        coin.style.left = left + "%";
        coin.style.animationDuration = dur + "s, " + spinDur + "s";

        layer.appendChild(coin);
        setTimeout(function(){
          coin.remove();
        }, dur * 1000 + 200);
      }

      function startCoins() {
        if (coinTimer) return;
        coinTimer = setInterval(function(){
          var n = 1 + Math.floor(Math.random() * 2);
          for (var i = 0; i < n; i++) {
            spawnCoin();
          }
        }, 900);
      }

      function stopCoins() {
        if (!coinTimer) return;
        clearInterval(coinTimer);
        coinTimer = null;
      }

      function createEventId(){
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
          var r = Math.random() * 16 | 0;
          var v = c === "x" ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      function sendTrack(eventName, params, options){
        try{
          if (typeof fbq === "function") {
            fbq("track", eventName, params, options);
          }
        }catch(e){}
      }

      function sendTrackCustom(eventName, params, options){
        try{
          if (typeof fbq === "function") {
            fbq("trackCustom", eventName, params, options);
          }
        }catch(e){}
      }

      function trackMainCTA(area){
        var eventId = createEventId();

        var leadParams = {
          content_name: "telegram_bot_click",
          content_category: "telegram_redirect",
          contact_method: "telegram",
          click_area: area || "main_cta",
          destination: "telegram_bot",
          value: 1.00,
          currency: "USD"
        };

        var customParams = {
          click_area: area || "main_cta",
          destination: "telegram_bot",
          contact_method: "telegram"
        };

        sendTrack("Lead", leadParams, { eventID: eventId });
        sendTrackCustom("TelegramClick", customParams, { eventID: eventId });
      }

      function trackSupportCTA(area){
        var eventId = createEventId();

        var contactParams = {
          content_name: "telegram_support_click",
          content_category: "telegram_redirect",
          contact_method: "telegram",
          click_area: area || "tg_support",
          destination: "telegram_support"
        };

        var customParams = {
          click_area: area || "tg_support",
          destination: "telegram_support",
          contact_method: "telegram"
        };

        sendTrack("Contact", contactParams, { eventID: eventId });
        sendTrackCustom("TelegramSupportClick", customParams, { eventID: eventId });
      }

      function go(url){
        window.location.href = url;
      }

      function resetState(){
        isRedirecting = false;
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
        ctaBtn.classList.remove("is-disabled");
        tgSupport.classList.remove("is-disabled");
      }

      startCoins();

      document.addEventListener("visibilitychange", function(){
        if (document.hidden) {
          stopCoins();
        } else {
          startCoins();
        }
      });

      window.addEventListener("pageshow", function(event){
        if (event.persisted) {
          resetState();
        } else {
          isRedirecting = false;
        }
      });

      ctaBtn.addEventListener("click", function(e){
        e.preventDefault();
        if (isRedirecting) return;

        isRedirecting = true;
        ctaBtn.classList.add("is-disabled");
        tgSupport.classList.add("is-disabled");

        trackMainCTA(this.getAttribute("data-area") || "main_cta");

        redirectTimer = setTimeout(function(){
          go(TARGET_URL);
        }, REDIRECT_DELAY);
      }, { passive:false });

      tgSupport.addEventListener("click", function(){
        trackSupportCTA(this.getAttribute("data-area") || "tg_support");
      });
    })();
  </script>
</body>
</html>
